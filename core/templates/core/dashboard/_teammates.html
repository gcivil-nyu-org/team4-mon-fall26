<div class="card">
  <div class="card-header"><h3 class="card-title">Teammates</h3></div>
  <div class="card-body">
    {% if teammates %}
      <div class="avatar-list">
        {% for mate in teammates %}{% include "components/avatar.html" with person=mate size="sm" labelled=True %}{% endfor %}
        {% if teammate_count > 5 %}<span class="avatar avatar-sm rounded-circle pn-num" aria-label="and {{ teammate_count|add:'-5' }} more">+{{ teammate_count|add:"-5" }}</span>{% endif %}
      </div>
    {% else %}
      <div class="empty py-2">
        <div class="empty-icon"><i aria-hidden="true" class="ti ti-users"></i></div>
        <p class="empty-subtitle text-secondary">Your teammates will show up here once you join a team.</p>
      </div>
    {% endif %}
  </div>
</div>
