<div class="row row-cards mb-4">
  <div class="col-6 col-lg-3">
    <div class="card card-sm h-100"><div class="card-body">
      <div class="subheader">Teams</div>
      <div class="h1 mb-0 pn-num">{{ team_count }}</div>
    </div></div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-sm h-100"><div class="card-body">
      <div class="subheader">Captain of</div>
      <div class="h1 mb-0 pn-num">{{ captain_count }}</div>
    </div></div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-sm h-100"><div class="card-body">
      <div class="subheader">Teammates</div>
      <div class="h1 mb-0 pn-num">{{ teammate_count }}</div>
    </div></div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="card card-sm h-100"><div class="card-body">
      <div class="subheader">Games played</div>
      <div class="h1 mb-0 pn-num text-secondary">–</div>

    </div></div>
  </div>
