[flake8]
max-line-length = 120
exclude = .git,__pycache__,migrations,venv,.venv,staticfiles
# Django's empty starter files import modules they don't use yet.
per-file-ignores =
    core/admin.py:F401
    core/models.py:F401

[coverage:run]
source = .
omit =
    */migrations/*
    */tests.py
    manage.py
    playnyu/asgi.py
    playnyu/wsgi.py
    venv/*
    .venv/*
