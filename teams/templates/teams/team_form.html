{% extends "base.html" %}
{% block title %}Create a team · PlayNYU{% endblock %}
{% block content %}
  <div class="pn-auth">
    <div class="card">
      <div class="card-body p-4">
        <div class="page-header mb-4">
          <h1>Create a team</h1>
          <div class="page-meta">You'll be the captain.</div>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "components/form_fields.html" %}
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Create team</button>
            <a class="btn btn-ghost-secondary" href="{% url 'teams:list' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
