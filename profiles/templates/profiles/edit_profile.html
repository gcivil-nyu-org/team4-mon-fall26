{% extends "teams/_layout.html" %}
{% block title %}Edit profile · PlayNYU{% endblock %}
{% block content %}
  <h1>Edit profile</h1>
  {% if form.errors %}
    <p>Your profile was not updated. Fix the errors below and submit again.</p>
  {% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
  </form>
{% endblock %}
