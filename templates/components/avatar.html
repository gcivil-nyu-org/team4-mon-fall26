{% load ui %}{# A person: always a circle. See docs/DESIGN.md, "Avatar". TODO: show the profile photo once uploads exist. #}
{% with name=person.get_full_name|default:person.email %}<span class="avatar avatar-{{ size|default:'sm' }} rounded-circle bg-primary-lt" {% if labelled %}role="img" aria-label="{{ name }}" title="{{ name }}"{% else %}aria-hidden="true"{% endif %}>{{ person|initials }}</span>{% endwith %}
