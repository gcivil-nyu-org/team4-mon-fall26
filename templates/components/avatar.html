{% load ui %}{# A person: always a circle. See docs/DESIGN.md, "Avatar". Never show the email. TODO: show the profile photo once uploads exist. #}
{% with name=person|display_name %}<span class="avatar avatar-{{ size|default:'sm' }} rounded-circle bg-primary-lt" {% if labelled %}role="img" aria-label="{{ name }}" title="{{ name }}"{% else %}aria-hidden="true"{% endif %}>{{ person|initials }}</span>{% endwith %}
