{% extends "base.html" %}
{% block title %}Password updated · PlayNYU{% endblock %}
{% block content %}
  <div class="pn-auth">
    <div class="card">
      <div class="card-body p-4 text-center">
        <span class="avatar avatar-lg rounded-circle bg-green-lt mb-3"><i aria-hidden="true" class="ti ti-lock-check"></i></span>
        <div class="page-header mb-3"><h1>Password updated</h1></div>
        <p class="text-secondary">Your password has been reset. You can now log in with your new password.</p>
        <a class="btn btn-primary w-100" href="{% url 'login' %}">Log in</a>
      </div>
    </div>
  </div>
{% endblock %}
