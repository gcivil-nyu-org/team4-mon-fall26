{% extends "teams/_layout.html" %}
{% block title %}Log in · PlayNYU{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <p>Log in with your NYU email.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p><a href="{% url 'accounts:resend' %}">Didn't get your confirmation email?</a></p>
  <p>New here?</p>
  <form method="get" action="{% url 'accounts:signup' %}">
    <button type="submit">Sign up</button>
  </form>
{% endblock %}
