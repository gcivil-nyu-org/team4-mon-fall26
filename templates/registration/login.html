{% extends "teams/_layout.html" %}
{% block title %}Log in · PlayNYU{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="{% url 'accounts:register' %}">Register with your NYU email</a>.
     Did not get the confirmation email? <a href="{% url 'accounts:resend' %}">Send it again</a>.</p>
{% endblock %}
