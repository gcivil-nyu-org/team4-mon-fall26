{% if show_panel %}
<div class="card" id="team-chat">
  <div class="card-header"><h3 class="card-title">Chat</h3><div class="card-actions"><a href="{% url 'chat:inbox' %}">All chats</a></div></div>
  {% if rows %}
    {% include "chat/_conversation_list.html" with rows=rows compact=True %}
  {% else %}
    <div class="card-body">
      <div class="empty py-2">
        <div class="empty-icon"><i aria-hidden="true" class="ti ti-messages"></i></div>
        <p class="empty-subtitle text-secondary">Join a team or start a chat.</p>
      </div>
    </div>
  {% endif %}
</div>
{% endif %}
